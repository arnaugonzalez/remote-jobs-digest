  - {name: DataAnnotation, category: ai_data_work, match: [dataannotation], source: "https://www.dataannotation.tech/about-us"}
  - {name: Alignerr, category: ai_data_work, match: [alignerr], source: "https://www.alignerr.com/about"}
  - {name: Toloka, category: ai_data_work, match: [toloka], source: "https://toloka.ai/about"}
  - {name: Invisible Technologies, category: ai_data_work, match: [invisible technologies, invisibletech], source: "https://invisibletech.ai/about"}
  - {name: Handshake AI, category: ai_data_work, match: [handshake ai], source: "https://joinhandshake.com/fellowship-program/"}
  - {name: Crossing Hurdles, category: ai_data_work, match: [crossing hurdles], source: "https://www.crossinghurdles.com/"}

  # --- reposting_intermediary: reposts roles of other companies ---
  - {name: Jobgether, category: reposting_intermediary, match: [jobgether], source: "https://jobgether.com/"}
