[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "remote-jobs-digest"
version = "0.1.0"
description = "A daily digest of remote jobs you are actually eligible for: ~11k public ATS boards and remote job APIs, filtered by a declarative profile."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnau González del Molino" }]
requires-python = ">=3.11"
keywords = ["jobs", "remote", "job-search", "greenhouse", "lever", "ashby", "digest", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "pyyaml>=6.0.1",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# LinkedIn guest API needs nothing extra; Indeed/Glassdoor/Google go through JobSpy.
boards = ["python-jobspy>=1.1.80"]
apply = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rjs = "remote_jobs_digest.cli:main"

[project.urls]
Homepage = "https://github.com/arnaugonzalez/remote-jobs-digest"
Issues = "https://github.com/arnaugonzalez/remote-jobs-digest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_jobs_digest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "deploy", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B905"]
